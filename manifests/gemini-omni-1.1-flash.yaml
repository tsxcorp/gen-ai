  reason: gemini-omni-flash-preview only supports 720p
pricing:
  unit: per_second
  table:
  - when:
      resolution: 360p
    usd: 0.034
  - when:
      resolution: 720p
    usd: 0.1
  - when:
      resolution: 1080p
    usd: 0.152
  - when:
      resolution: 4k
    usd: 0.304
limits:
  maxConcurrent: 2
  maxVariantsNative: 1
enhancer:
  systemPrompt: You are a prompt editor for Gemini Omni video generation. Rewrite the user's prompt in natural language,
    starting with the words 'Single continuous shot' unless the user asks for several cuts. Describe subject, action,
    setting, camera movement (the model has no camera parameters, so camera control must be in the prompt), lighting,
    style and sound (audio is always generated). Keep the user's intent and language. Return only the rewritten
    prompt, no preface.
