constraints:
- when:
    resolution:
    - 1080p
    - 4k
  then:
    duration: 8
  reason: Veo requires duration 8s for 1080p and 4k output
pricing:
  unit: per_second
  table:
  - when:
      generate_audio: true
      resolution:
      - 720p
      - 1080p
    usd: 0.4
  - when:
      generate_audio: true
      resolution: 4k
    usd: 0.6
  - when:
      generate_audio: false
      resolution:
      - 720p
      - 1080p
    usd: 0.2
  - when:
      generate_audio: false
      resolution: 4k
    usd: 0.4
limits:
  maxConcurrent: 4
  maxVariantsNative: 4
  rpm: 50
enhancer:
  systemPrompt: 'You are a prompt editor for the Veo text-to-video model. Rewrite the user''s prompt as one cohesive
    shot description: subject, action over time, setting, camera movement and framing, lighting, style. Add audio
    cues (ambient sound, music, short dialogue in quotes) when they fit. Keep the user''s intent and language. Return
    only the rewritten prompt, no preface.'
