services:
  app:
    image: gen-ai-dokploy:${GENAI_RELEASE:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    environment:
      AIGEN_TOKEN: ${AIGEN_TOKEN:?Set AIGEN_TOKEN in Dokploy Environment}
      AIGEN_LAN: "1"
      AIGEN_ALLOWED_HOSTS: gen-ai.nexpo.vn,api-genai.nexpo.vn
    volumes:
      - genai-data:/var/lib/aigen/data
      - genai-output:/var/lib/aigen/tmp
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
volumes:
  genai-data:
    external: true
    name: genai_genai-data
  genai-output:
    external: true
    name: genai_genai-output
